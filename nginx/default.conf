server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprime las respuestas: menos bytes por la red = menos costo en la nube.
    gzip on;
    gzip_types text/css application/javascript text/html;

    # Endpoint de salud. El HEALTHCHECK del Dockerfile pega aquí.
    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
